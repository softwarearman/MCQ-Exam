<head>

<title>MCQ Exam – ঢাবি খ-ইউনিট প্রস্তুতি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1c2340;--mute:#65708f;--line:#e2e6f2;--pri:#3b5bdb;--pri2:#2b46b5;--ok:#12a150;--okbg:#e6f7ee;--bad:#d6293e;--badbg:#fdecee;--warn:#d9822b;--warnbg:#fff4e5;--bn:#3b5bdb;--en:#0b8a5f;--gk:#d9480f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;font-size:16px;line-height:1.55}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.brand{font-weight:700;font-size:18px;margin-right:auto;color:var(--pri2)}
.nav a{display:inline-block;padding:8px 16px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:600}
.nav a.on{background:var(--pri);color:#fff}
.nav a:not(.on):hover{background:#eef1fb}
main{max-width:1040px;margin:auto;padding:20px 16px 60px}
h1{font-size:24px;margin:4px 0 16px}h2{font-size:19px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
.stat{padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.stat b{display:block;font-size:28px;line-height:1.2}.stat span{color:var(--mute);font-size:14px}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri2)}.btn.ghost{background:#eef1fb;color:var(--pri2)}.btn.ghost:hover{background:#e0e6f8}
.btn.red{background:var(--bad)}.btn.sm{padding:6px 14px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:10px;background:#e8ecf7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--mute);font-weight:600;font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.t-bn{background:#e8edff;color:var(--bn)}.t-en{background:#e0f6ee;color:var(--en)}.t-gk{background:#ffeadf;color:var(--gk)}
.c-ok{color:var(--ok);font-weight:700}.c-bad{color:var(--bad);font-weight:700}.c-sk{color:var(--warn);font-weight:700}
.q-text{font-size:19px;font-weight:600;margin:10px 0 14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #b9c1dc;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--pri);background:#eef1ff}.opt.sel .l{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.static{cursor:default}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pal button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 0;font:inherit;font-size:14px;cursor:pointer}
.pal button.done{background:#dfe6ff;border-color:#9fb1f5}.pal button.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.pal-h{font-weight:600;font-size:14px;margin:12px 0 6px}
.timer{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
.filters button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ans-line{font-size:15px;margin-top:6px}.ans-line b{font-weight:700}
.exp{margin-top:10px;background:#f1f4fb;border-left:4px solid var(--pri);padding:10px 12px;border-radius:8px;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(20,26,50,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%}
.empty{text-align:center;color:var(--mute);padding:26px 0}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;font-weight:700}
.g2{grid-template-columns:1.2fr 1fr}
html,body{overflow-x:hidden}
.q-text,.opt span,.card{overflow-wrap:anywhere}
.opt span:last-child{min-width:0}
@media(max-width:760px){
  .g2{grid-template-columns:1fr}
  .top{position:static}
  .top .in{flex-wrap:wrap;padding:10px 12px;gap:6px}
  .brand{flex:1 1 100%;font-size:17px;margin:0}
  .nav{display:flex;gap:6px;width:100%}
  .nav a{flex:1;text-align:center;padding:9px 6px;font-size:15px}
  main{padding:14px 12px 50px}
  h1{font-size:21px}h2{font-size:17px}
  .card{padding:14px;border-radius:14px}
  .stat{padding:12px}.stat b{font-size:23px}.stat span{font-size:13px}
  .q-text{font-size:17px}
  .opt{padding:10px 11px;gap:10px;font-size:16px}
  .opt .l{width:28px;height:28px}
  .layout{gap:12px}
  .pal{grid-template-columns:repeat(7,1fr)}
  .pal button{padding:8px 0}
  .xbar{position:sticky;top:0;z-index:5;padding:10px 12px!important;gap:8px}
  .xbar .timer{font-size:17px}
  .xnav{display:grid!important;grid-template-columns:1fr 1fr;gap:8px}
  .xnav .btn{width:100%;padding:10px 6px}
  .xnav .sp{margin-left:0}
  .xnav [data-act=clear]{order:3;grid-column:1/-1}
  .ring{width:110px;height:110px;margin:0 auto}.ring div{width:84px;height:84px;font-size:22px}
  .rv>div{flex:1 1 100%!important;min-width:0!important}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr.hd{display:none}
  .rt tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
  .rt td{border:0;display:flex;justify-content:space-between;align-items:center;padding:4px 0}
  .rt td::before{content:attr(data-label);color:var(--mute);font-size:14px}
  .rt td:last-child{display:block;padding-top:8px}.rt td:last-child::before{content:none}
  .rt td:last-child .btn{width:100%}
  .filters{gap:6px}.filters button{padding:6px 11px;font-size:13px}
  .modal .box{padding:18px}
}
</style>

["'টেকসই উন্নয়ন লক্ষ্য'-এর যে লক্ষ্যটি মানসম্মত শিক্ষা নিয়ে নিবিড়ভাবে আলোচনা করে—",["এসডিজি-৪","এসডিজি-৩","এসডিজি-৯","এসডিজি-৮"],0],
["বাংলাদেশের আবহাওয়া অধিদপ্তর যে মন্ত্রণালয়ের অধীন—",["স্বরাষ্ট্র","পরিবেশ, বন ও জলবায়ু পরিবর্তন","প্রতিরক্ষা","দুর্যোগ ব্যবস্থাপনা ও ত্রাণ"],2]
]}
};

/* ================= কনফিগ ================= */
const SUBJ={bn:{n:'বাংলা',c:'t-bn',col:'var(--bn)'},en:{n:'English',c:'t-en',col:'var(--en)'},gk:{n:'সাধারণ জ্ঞান',c:'t-gk',col:'var(--gk)'}};
const PLAN={bn:5,en:5,gk:10}; /* প্রতি PDF থেকে */
const PDFS=['A','B','C'];
const DURATION=60*60*1000; /* ৬০ মিনিট */
const LET=['A','B','C','D'];

/* ================= ডেটা প্রস্তুত ================= */
const QB=[];const QM={};
PDFS.forEach(p=>Object.keys(SUBJ).forEach(s=>BANK[p][s].forEach((r,i)=>{
  const q={id:`${p}-${s}-${i+1}`,p,s,q:r[0],o:r[1],a:r[2],e:r[3]||''};QB.push(q);QM[q.id]=q;
})));

/* ================= সংরক্ষণ (reload করলেও থাকবে) ================= */
const KEY='du_mcq_exam_v1';
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.history)return r}catch(e){}return{seen:{},history:[],current:null}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= সহায়ক ================= */
const $=s=>document.querySelector(s);
const bn=n=>Number(n).toLocaleString('bn-BD');
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtDate(t){return new Date(t).toLocaleString('bn-BD',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})}
function fmtDur(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return `${bn(m)} মি ${bn(s)} সে`}
function pct(a,b){return b?Math.round(a*100/b):0}
let timerH=null;

/* এখনও না-দেখা প্রশ্নকে অগ্রাধিকার দিয়ে random বাছাই */
function pick(p,s,n){
  const pool=shuffle(QB.filter(q=>q.p===p&&q.s===s));
  pool.sort((a,b)=>(S.seen[a.id]||0)-(S.seen[b.id]||0));
  return pool.slice(0,n);
}
function unseenCount(){return QB.filter(q=>!S.seen[q.id]).length}

/* ================= পরীক্ষা শুরু / শেষ ================= */
function startExam(){
  const ids=[];
  Object.keys(PLAN).forEach(s=>{
    const g=[];PDFS.forEach(p=>g.push(...pick(p,s,PLAN[s])));
    shuffle(g);ids.push(...g.map(q=>q.id));
  });
  ids.forEach(id=>S.seen[id]=(S.seen[id]||0)+1);
  S.current={ids,ans:{},idx:0,start:Date.now()};
  save();route();
}
function finishExam(auto){
  const c=S.current;if(!c)return;
  let correct=0,wrong=0,skip=0;const sub={};
  Object.keys(SUBJ).forEach(k=>sub[k]={c:0,w:0,s:0,t:0});
  c.ids.forEach(id=>{const q=QM[id],a=c.ans[id],b=sub[q.s];b.t++;
    if(a==null){skip++;b.s++}else if(a===q.a){correct++;b.c++}else{wrong++;b.w++}});
  const rec={id:Date.now().toString(36),no:S.history.length+1,date:Date.now(),time:Math.min(Date.now()-c.start,DURATION),ids:c.ids,ans:c.ans,correct,wrong,skip,sub};
  S.history.unshift(rec);S.current=null;save();
  location.hash='#/review/'+rec.id;
}

/* ================= মডাল ================= */
function modal(html){$('#modal').innerHTML=`<div class="modal"><div class="box">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}

/* ================= পেজ: Dashboard ================= */
function pageDashboard(){
  const H=S.history,n=H.length;
  const tc=H.reduce((a,r)=>a+r.correct,0),tw=H.reduce((a,r)=>a+r.wrong,0),ts=H.reduce((a,r)=>a+r.skip,0);
  const avg=n?Math.round(H.reduce((a,r)=>a+pct(r.correct,r.ids.length),0)/n):0;
  const best=n?Math.max(...H.map(r=>r.correct)):0;
  const seenU=QB.filter(q=>S.seen[q.id]).length;
  let sh='';
  Object.keys(SUBJ).forEach(k=>{
    const c=H.reduce((a,r)=>a+r.sub[k].c,0),t=H.reduce((a,r)=>a+r.sub[k].t,0),w=H.reduce((a,r)=>a+r.sub[k].w,0);
    sh+=`<div style="margin-bottom:14px"><div class="row"><span class="tag ${SUBJ[k].c}">${SUBJ[k].n}</span><span class="sp" style="color:var(--mute);font-size:14px">সঠিক ${bn(c)} • ভুল ${bn(w)} • ${bn(pct(c,t))}%</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${pct(c,t)}%;background:${SUBJ[k].col}"></i></div></div>`;
  });
  $('#app').innerHTML=`
  <h1>📊 Dashboard</h1>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat"><b>${bn(n)}</b><span>মোট পরীক্ষা দিয়েছেন</span></div>
    <div class="stat"><b>${bn(avg)}%</b><span>গড় স্কোর</span></div>
    <div class="stat"><b class="c-ok">${bn(tc)}</b><span>মোট সঠিক</span></div>
    <div class="stat"><b class="c-bad">${bn(tw)}</b><span>মোট ভুল ${ts?`• বাদ ${bn(ts)}`:''}</span></div>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card" style="margin:0"><h2>বিষয়ভিত্তিক ফলাফল</h2>${n?sh:'<div class="empty">পরীক্ষা দিলে এখানে বিষয়ভিত্তিক ফলাফল দেখা যাবে।</div>'}</div>
    <div class="card" style="margin:0"><h2>প্রশ্নব্যাংক</h2>
      <p style="margin:0 0 8px;color:var(--mute)">মোট প্রশ্ন <b style="color:var(--ink)">${bn(QB.length)}</b> • দেখা হয়েছে <b style="color:var(--ink)">${bn(seenU)}</b></p>
      <div class="bar"><i style="width:${pct(seenU,QB.length)}%;background:var(--pri)"></i></div>
      <p style="color:var(--mute);font-size:14px;margin:10px 0 14px">সর্বোচ্চ স্কোর: <b style="color:var(--ink)">${bn(best)}/${bn(60)}</b></p>
      <button class="btn" data-go="#/exam">নতুন পরীক্ষা দিন →</button></div>
  </div>
  <div class="card"><div class="row"><h2 style="margin:0">সাম্প্রতিক পরীক্ষা</h2>${n>5?'<a class="sp" href="#/history">সব দেখুন →</a>':''}</div>${historyTable(H.slice(0,5))}</div>`;
}
function historyTable(list){
  if(!list.length)return '<div class="empty">এখনও কোনো পরীক্ষা দেওয়া হয়নি।</div>';
  return `<div><table class="rt"><tr class="hd"><th>#</th><th>তারিখ</th><th>স্কোর</th><th>সঠিক</th><th>ভুল</th><th>বাদ</th><th>সময়</th><th></th></tr>`+
  list.map(r=>`<tr><td data-label="পরীক্ষা">#${bn(r.no)}</td><td data-label="তারিখ">${fmtDate(r.date)}</td><td data-label="স্কোর"><span><b>${bn(r.correct)}/${bn(r.ids.length)}</b> <span style="color:var(--mute)">(${bn(pct(r.correct,r.ids.length))}%)</span></span></td>
  <td class="c-ok" data-label="সঠিক">${bn(r.correct)}</td><td class="c-bad" data-label="ভুল">${bn(r.wrong)}</td><td class="c-sk" data-label="বাদ">${bn(r.skip)}</td><td data-label="সময়">${fmtDur(r.time)}</td>
  <td><button class="btn sm" data-go="#/review/${r.id}">View</button></td></tr>`).join('')+`</table></div>`;
}

/* ================= পেজ: ফলাফল (সব পরীক্ষা) ================= */
function pageHistory(){
  $('#app').innerHTML=`<h1>🗂️ সব পরীক্ষার ফলাফল</h1><div class="card">${historyTable(S.history)}</div>
  ${S.history.length?'<div style="text-align:right"><button class="btn ghost sm" data-act="reset">সব ডেটা মুছুন</button></div>':''}`;
}

/* ================= পেজ: Exam ================= */
function pageExam(){
  const c=S.current;
  if(!c){
    const left=unseenCount();
    $('#app').innerHTML=`<h1>📝 Exam</h1>
    <div class="card">
      <h2>মডেল টেস্ট</h2>
      <div class="grid g3" style="margin-bottom:14px">
        <div class="stat"><b style="color:var(--bn)">১৫</b><span>বাংলা</span></div>
        <div class="stat"><b style="color:var(--en)">১৫</b><span>English</span></div>
        <div class="stat"><b style="color:var(--gk)">৩০</b><span>সাধারণ জ্ঞান </span></div>
      </div>
      <p style="margin:0 0 6px">মোট <b>৬০টি</b> MCQ • সময় <b>৬০ মিনিট</b> • প্রতিবার আলাদা ও এলোমেলো প্রশ্ন।</p>
      <p style="margin:0 0 16px;color:var(--mute);font-size:15px">এখনও একবারও না-আসা প্রশ্ন বাকি: <b>${bn(left)}</b> / ${bn(QB.length)}।
      ${left===0?'সব প্রশ্ন একবার করে এসে গেছে, এখন থেকে যেগুলো কম এসেছে সেগুলো আগে আসবে।':''}</p>
      <button class="btn" data-act="start" style="font-size:17px;padding:12px 28px">পরীক্ষা শুরু করুন</button>
    </div>`;
    return;
  }
  renderExamBody();
}
function renderExamBody(){
  const c=S.current;if(!c)return;
  const id=c.ids[c.idx],q=QM[id],sel=c.ans[id];
  const answered=Object.keys(c.ans).length;
  /* palette */
  let pal='',off=0;
  Object.keys(SUBJ).forEach(k=>{
    const cnt=c.ids.filter(i=>QM[i].s===k).length;
    pal+=`<div class="pal-h">${SUBJ[k].n}</div><div class="pal">`;
    for(let i=off;i<off+cnt;i++){pal+=`<button data-q="${i}" class="${c.ans[c.ids[i]]!=null?'done':''} ${i===c.idx?'cur':''}">${bn(i+1)}</button>`}
    pal+='</div>';off+=cnt;
  });
  $('#app').innerHTML=`
  <div class="card row xbar" style="position:sticky;top:0;z-index:5">
    <div>উত্তর দেওয়া: <b>${bn(answered)}/${bn(c.ids.length)}</b></div>
    <div class="timer sp" id="timer">--:--</div>
    <button class="btn red sm" data-act="submit">জমা দিন</button>
  </div>
  <div class="layout">
    <div class="card">
      <div class="row"><span class="tag ${SUBJ[q.s].c}">${SUBJ[q.s].n}</span><span style="color:var(--mute)">প্রশ্ন ${bn(c.idx+1)} / ${bn(c.ids.length)}</span></div>
      <div class="q-text">${esc(q.q)}</div>
      ${q.o.map((t,i)=>`<button class="opt ${sel===i?'sel':''}" data-opt="${i}"><span class="l">${LET[i]}</span><span>${esc(t)}</span></button>`).join('')}
      <div class="row xnav" style="margin-top:14px">
        <button class="btn ghost" data-act="prev" ${c.idx===0?'disabled':''}>← আগের</button>
        <button class="btn ghost" data-act="clear" ${sel==null?'disabled':''}>উত্তর মুছুন</button>
        <button class="btn sp" data-act="next" ${c.idx===c.ids.length-1?'disabled':''}>পরের →</button>
      </div>
    </div>
    <div class="card"><h2 style="font-size:16px">প্রশ্ন তালিকা</h2>${pal}</div>
  </div>`;
  tick();clearInterval(timerH);timerH=setInterval(tick,1000);
}
function tick(){
  const c=S.current,el=$('#timer');if(!c||!el){clearInterval(timerH);return}
  const left=DURATION-(Date.now()-c.start);
  if(left<=0){clearInterval(timerH);finishExam(true);return}
  const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
  el.textContent='⏱ '+bn(String(m).padStart(2,'0'))+':'+bn(String(s).padStart(2,'0'));
  el.classList.toggle('low',left<5*60000);
}

/* ================= পেজ: Review ================= */
let rf='wrong';
function pageReview(id){
  const r=S.history.find(x=>x.id===id);
  if(!r){$('#app').innerHTML='<div class="card empty">এই পরীক্ষাটি খুঁজে পাওয়া যায়নি। <br><br><button class="btn" data-go="#/dashboard">Dashboard</button></div>';return}
  const total=r.ids.length,p=pct(r.correct,total);
  const col=p>=60?'var(--ok)':p>=40?'var(--warn)':'var(--bad)';
  let sh='';
  Object.keys(SUBJ).forEach(k=>{const b=r.sub[k];
    sh+=`<div style="margin-bottom:10px"><div class="row"><span class="tag ${SUBJ[k].c}">${SUBJ[k].n}</span><span class="sp" style="font-size:14px;color:var(--mute)"><span class="c-ok">${bn(b.c)}</span> সঠিক • <span class="c-bad">${bn(b.w)}</span> ভুল • <span class="c-sk">${bn(b.s)}</span> বাদ</span></div>
    <div class="bar" style="margin-top:5px"><i style="width:${pct(b.c,b.t)}%;background:${SUBJ[k].col}"></i></div></div>`});
  const items=r.ids.map((qid,i)=>({q:QM[qid],i,a:r.ans[qid]})).filter(x=>{
    const st=x.a==null?'skip':x.a===x.q.a?'ok':'wrong';
    return rf==='all'||(rf==='wrong'&&st==='wrong')||(rf==='ok'&&st==='ok')||(rf==='skip'&&st==='skip')});
  const fb=(k,t)=>`<button class="${rf===k?'on':''}" data-f="${k}">${t}</button>`;
  $('#app').innerHTML=`
  <div class="row" style="margin-bottom:6px"><h1 style="margin:0">পরীক্ষা #${bn(r.no)} — ফলাফল</h1><button class="btn ghost sm sp" data-go="#/dashboard">← Dashboard</button></div>
  <div class="card row rv" style="gap:22px">
    <div class="ring" style="background:conic-gradient(${col} ${p*3.6}deg,#e8ecf7 0)"><div>${bn(p)}%</div></div>
    <div style="flex:1;min-width:230px">
      <div style="font-size:26px;font-weight:700">${bn(r.correct)} / ${bn(total)}</div>
      <div style="margin:4px 0 12px"><span class="c-ok">সঠিক ${bn(r.correct)}</span> • <span class="c-bad">ভুল ${bn(r.wrong)}</span> • <span class="c-sk">বাদ ${bn(r.skip)}</span><br><span style="color:var(--mute);font-size:14px">${fmtDate(r.date)} • সময় লেগেছে ${fmtDur(r.time)}</span></div>
      <button class="btn" data-act="start">আবার নতুন পরীক্ষা দিন</button>
    </div>
    <div style="flex:1;min-width:260px">${sh}</div>
  </div>
  <div class="row filters" style="margin-bottom:14px">${fb('wrong',`❌ ভুল (${bn(r.wrong)})`)}${fb('skip',`⏭ বাদ (${bn(r.skip)})`)}${fb('ok',`✅ সঠিক (${bn(r.correct)})`)}${fb('all','সব প্রশ্ন')}</div>
  ${items.length?items.map(x=>reviewCard(x)).join(''):'<div class="card empty">এই ক্যাটাগরিতে কোনো প্রশ্ন নেই 🎉</div>'}`;
}
function reviewCard({q,i,a}){
  const st=a==null?'skip':a===q.a?'ok':'wrong';
  const badge=st==='ok'?'<span class="c-ok">✅ সঠিক</span>':st==='wrong'?'<span class="c-bad">❌ ভুল</span>':'<span class="c-sk">⏭ উত্তর দেওয়া হয়নি</span>';
  return `<div class="card"><div class="row"><span class="tag ${SUBJ[q.s].c}">${SUBJ[q.s].n}</span><span style="color:var(--mute)">প্রশ্ন ${bn(i+1)}</span><span class="sp">${badge}</span></div>
  <div class="q-text">${esc(q.q)}</div>
  ${q.o.map((t,k)=>`<div class="opt static ${k===q.a?'ok':k===a?'bad':''}"><span class="l">${LET[k]}</span><span>${esc(t)}</span></div>`).join('')}
  <div class="ans-line">${a==null?'আপনার উত্তর: <b class="c-sk">দেওয়া হয়নি</b>':`আপনার উত্তর: <b class="${st==='ok'?'c-ok':'c-bad'}">${LET[a]}</b>`} • সঠিক উত্তর: <b class="c-ok">${LET[q.a]} (${esc(q.o[q.a])})</b></div>
  ${q.e?`<div class="exp"><b>ব্যাখ্যা:</b> ${esc(q.e)}</div>`:''}</div>`;
}

/* ================= রাউটার ================= */
function route(){
  clearInterval(timerH);closeModal();
  const h=location.hash||'#/dashboard';
  const [,r,arg]=h.split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===(r==='review'?'history':r)));
  if(r==='exam')pageExam();
  else if(r==='history')pageHistory();
  else if(r==='review'){rf='wrong';pageReview(arg)}
  else pageDashboard();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ================= ক্লিক হ্যান্ডলার ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-opt],[data-q],[data-f]');if(!t)return;
  const c=S.current;
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.dataset.f){rf=t.dataset.f;pageReview(location.hash.split('/')[2]);return}
  if(t.dataset.opt!==undefined&&c){
    const id=c.ids[c.idx],v=+t.dataset.opt;
    if(c.ans[id]===v)delete c.ans[id];else c.ans[id]=v;
    save();renderExamBody();return}
  if(t.dataset.q!==undefined&&c){c.idx=+t.dataset.q;save();renderExamBody();return}
  switch(t.dataset.act){
    case'start':
      if(location.hash!=='#/exam')location.hash='#/exam';
      startExam();break;
    case'prev':if(c&&c.idx>0){c.idx--;save();renderExamBody()}break;
    case'next':if(c&&c.idx<c.ids.length-1){c.idx++;save();renderExamBody()}break;
    case'clear':if(c){delete c.ans[c.ids[c.idx]];save();renderExamBody()}break;
    case'submit':{
      const un=c.ids.length-Object.keys(c.ans).length;
      modal(`<h2>পরীক্ষা জমা দেবেন?</h2><p style="color:var(--mute)">${un?`আপনি এখনও <b style="color:var(--bad)">${bn(un)}টি</b> প্রশ্নের উত্তর দেননি।`:'সব প্রশ্নের উত্তর দেওয়া হয়েছে।'} জমা দিলে আর পরিবর্তন করা যাবে না।</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="cancel">ফিরে যান</button><button class="btn red" data-act="confirm">জমা দিন</button></div>`);break}
    case'cancel':closeModal();break;
    case'confirm':closeModal();finishExam();break;
    case'reset':
      modal(`<h2>সব ডেটা মুছবেন?</h2><p style="color:var(--mute)">সব পরীক্ষার ফলাফল ও প্রশ্নের ইতিহাস মুছে যাবে।</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="cancel">না</button><button class="btn red" data-act="doreset">হ্যাঁ, মুছুন</button></div>`);break;
    case'doreset':S={seen:{},history:[],current:null};save();location.hash='#/dashboard';route();break;
  }
});

route();
</script>
</body>
</html>
